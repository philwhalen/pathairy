[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pathery_rs"
version = "0.1.0"
description = "Rust Pathery engine and batched RL environment"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.maturin]
features = ["python"]
module-name = "pathery_rs"
