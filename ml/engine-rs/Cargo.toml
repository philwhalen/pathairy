[package]
name = "pathery_rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Pathery pathing engine (src/engine), for the RL training loop"
publish = false

[lib]
name = "pathery_rs"
crate-type = ["cdylib", "rlib"]

[features]
# Python module for the RL training loop (build with maturin, see README.md).
python = ["dep:pyo3", "dep:numpy", "dep:rayon"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311", "generate-import-lib"], optional = true }
numpy = { version = "0.29", optional = true }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
debug = 1
